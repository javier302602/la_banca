{% extends "base.html" %}
{# Página de error de navegación (404 / 405) en español — RNF-USA-05 #}

{% block title %}{{ titulo }}{% endblock %}
{% block pagina %}error{% endblock %}

{% block content %}
<div class="mx-auto text-center py-5" style="max-width: 36rem">
  <p class="display-6 text-body-secondary mb-2">{{ codigo }}</p>
  <h1 class="h4 mb-3">{{ titulo }}</h1>
  <p class="mb-4">{{ mensaje }}</p>
  <a class="btn btn-primary" href="/feed">Ir al inicio</a>
</div>
{% endblock %}
