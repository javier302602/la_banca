{% extends "base.html" %}
{# CU-08 — Feed «Ahora» #}

{% block title %}{{ t("feed.titulo") }}{% endblock %}
{% block pagina %}feed{% endblock %}

{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
  <h1 class="h4 mb-0"><i class="bi bi-lightning-charge-fill icono-titulo" aria-hidden="true"></i>{{ t("feed.titulo") }}</h1>
  <div class="d-flex gap-2 align-items-center">
    <label class="form-label mb-0 small text-nowrap" for="filtro-tipo">{{ t("feed.tipo") }}</label>
    <select class="form-select form-select-sm" id="filtro-tipo">
      <option value="" selected>{{ t("tipos.TODOS") }}</option>
      {% for valor in tipos %}<option value="{{ valor }}">{{ t("tipos." ~ valor) }}</option>{% endfor %}
    </select>
    <button class="btn btn-outline-secondary btn-sm d-none text-nowrap" type="button" id="quitar-filtro">{{ t("feed.ver_todos") }}</button>
    <button class="btn btn-outline-primary btn-sm text-nowrap" type="button" id="actualizar"><i class="bi bi-arrow-clockwise" aria-hidden="true"></i> {{ t("feed.actualizar") }}</button>
  </div>
</div>
<div id="mensajes" aria-live="polite"></div>
<div class="rejilla-feed" id="lista"></div>
<div class="estado-vacio d-none" id="vacio">
  <img src="/static/img/vacio-feed.svg" alt="">
  <p class="mb-3" id="vacio-texto" role="status"></p>
  <a class="btn btn-primary btn-sm" href="/publicaciones/nueva"><i class="bi bi-plus-circle" aria-hidden="true"></i> {{ t("vacio.publicar") }}</a>
</div>
<div id="centinela" class="py-3 text-center small text-body-secondary" aria-hidden="true"></div>
{% endblock %}

{% block scripts %}<script src="/static/js/feed.js"></script>{% endblock %}
