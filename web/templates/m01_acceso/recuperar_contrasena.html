{% extends "base.html" %}
{# CU-18 — Recuperar contraseña: solicitud #}

{% block title %}Recuperar contraseña{% endblock %}
{% block pagina %}recuperar{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <h1 class="h4 mb-3">Recuperar contraseña</h1>
    <div id="mensajes" aria-live="polite"></div>
    <form id="form-recuperar" novalidate>
      <div class="mb-3">
        <label class="form-label" for="correo">Correo institucional</label>
        <input class="form-control" id="correo" name="correo" type="email" autocomplete="email" required>
      </div>
      <button class="btn btn-primary" type="submit">Enviar enlace</button>
    </form>
    <p class="mt-3 small"><a href="/login">Volver a iniciar sesión</a></p>
  </div>
</div>
{% endblock %}

{% block scripts %}<script src="/static/js/acceso.js"></script>{% endblock %}
