<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}La Banca{% endblock %} · La Banca</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  {% block head %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-md bg-body-tertiary border-bottom">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="/feed">La Banca</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav-principal"
              aria-controls="nav-principal" aria-expanded="false" aria-label="Mostrar menú">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav-principal">
        {% if sesion %}
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="/feed">Ahora</a></li>
          <li class="nav-item"><a class="nav-link" href="/publicaciones/mias">Mis publicaciones</a></li>
          <li class="nav-item"><a class="nav-link" href="/chats">Mis chats</a></li>
        </ul>
        <div class="d-flex align-items-center gap-2">
          <span class="navbar-text">@{{ sesion.nickname }}</span>
          <form method="post" action="/sesiones/cerrar">
            <button class="btn btn-outline-secondary btn-sm" type="submit">Cerrar sesión</button>
          </form>
        </div>
        {% else %}
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/login">Iniciar sesión</a></li>
          <li class="nav-item"><a class="nav-link" href="/registro">Registrarse</a></li>
        </ul>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container py-4 flex-grow-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-top py-3 small text-body-secondary">
    <div class="container"><a href="/terminos">Términos de uso y política de privacidad</a></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
