# Automatismos programados (EA-03, EA-05, EA-07) cada hora, en UN solo job (~1 minuto facturable por ejecución).
# Los crons diarios de vercel.json quedan como respaldo; los jobs son idempotentes.
# Secrets requeridos en el repositorio: APP_BASE_URL (p. ej. https://la-banca.vercel.app) y CRON_SECRET.
name: Jobs programados

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: jobs-programados
  cancel-in-progress: false

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Verificar secrets
        run: |
          if [ -z "$APP_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Faltan los secrets APP_BASE_URL o CRON_SECRET"
            exit 1
          fi

      # Cada paso se ejecuta aunque falle el anterior; el job termina en rojo si alguno falla.
      - name: EA-03 limpiar chats expirados
        if: ${{ !cancelled() }}
        run: >-
          curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors --max-time 25
          --header "Authorization: Bearer ${CRON_SECRET}"
          "${APP_BASE_URL%/}/jobs/ea03-limpiar-chats-expirados"

      - name: EA-05 depurar contenido reportado
        if: ${{ !cancelled() }}
        run: >-
          curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors --max-time 25
          --header "Authorization: Bearer ${CRON_SECRET}"
          "${APP_BASE_URL%/}/jobs/ea05-depurar-contenido-reportado"

      - name: EA-07 eliminar cuentas no activadas
        if: ${{ !cancelled() }}
        run: >-
          curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors --max-time 25
          --header "Authorization: Bearer ${CRON_SECRET}"
          "${APP_BASE_URL%/}/jobs/ea07-eliminar-cuentas-no-activadas"
